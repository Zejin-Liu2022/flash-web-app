name: Deploy Flask App to Touge Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOUGE_SSH_KNOWN_HOSTS }}
          SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$SERVER_IP"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/touge_deploy
          chmod 600 ~/.ssh/touge_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy tested revision through SSH port 47263
        env:
          SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
        run: |
          ssh -i ~/.ssh/touge_deploy -p 47263 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$SERVER_IP" "bash -s -- $GITHUB_SHA" < scripts/deploy.sh
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/touge_deploy
